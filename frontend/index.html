<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توقع أسعار العقارات</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9f7ef;
            border: 1px solid #28a745;
            border-radius: 6px;
            text-align: center;
            color: #155724;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏡 توقع سعر الشقة</h2>
    
    <div class="form-group">
        <label>المساحة (قدم مربع):</label>
        <input type="number" id="area" value="120">
    </div>

    <div class="form-group">
        <label>عدد غرف النوم:</label>
        <input type="number" id="bedrooms" value="3">
    </div>

    <div class="form-group">
        <label>عدد الحمامات:</label>
        <input type="number" id="bathrooms" value="2">
    </div>

    <div class="form-group">
        <label>عدد البلكونات:</label>
        <input type="number" id="balcony" value="1">
    </div>

    <div class="form-group">
        <label>المنطقة (Location):</label>
        <input type="text" id="location" value="Whitefield">
    </div>

    <button onclick="predictPrice()">حساب السعر المتوقع 🚀</button>

    <div id="resultBox" class="result"></div>
</div>

<script>
    async function predictPrice() {
        const area = parseFloat(document.getElementById('area').value);
        const bedrooms = parseInt(document.getElementById('bedrooms').value);
        const bathrooms = parseInt(document.getElementById('bathrooms').value);
        const balcony = parseInt(document.getElementById('balcony').value);
        const location = document.getElementById('location').value;

        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        resultBox.innerHTML = 'جاري الحساب... ⏳';

        try {
            const response = await fetch('http://127.0.0.1:8000/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    area_sqft: area,
                    bedrooms: bedrooms,
                    bathrooms: bathrooms,
                    balcony: balcony,
                    location: location
                })
            });

            const data = await response.json();
            
            if (response.ok) {
                // تنسيق الرقم ليظهر بشكل منظم
                const formattedPrice = Number(data.predicted_price).toLocaleString('ar-EG', { maximumFractionDigits: 2 });
                resultBox.innerHTML = `السعر المتوقع: <br> <strong>${formattedPrice} جنيه / عملة</strong>`;
            } else {
                resultBox.innerHTML = 'حدث خطأ أثناء التوقع!';
            }
        } catch (error) {
            console.error('Error:', error);
            resultBox.innerHTML = 'تأكدي أن السيرفر (Backend) شغال!';
        }
    }
</script>

</body>
</html>
